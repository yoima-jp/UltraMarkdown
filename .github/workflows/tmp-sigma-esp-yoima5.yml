name: Temporary Sigma ESP yoima.5 build

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ tmp-sigma-esp-yoima5-20260807 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Download pinned SigmaRemake source
        run: |
          curl --fail --location --retry 3 \
            https://github.com/StormingMoon/SigmaRemake/archive/e3a4ef87da8853ce0b5a66adcc4869b530b9323f.zip \
            --output SigmaRemake.zip
          unzip -q SigmaRemake.zip
          mv SigmaRemake-e3a4ef87da8853ce0b5a66adcc4869b530b9323f SigmaRemake

      - name: Apply yoima.5 overlay
        run: |
          base64 -D -i tmp-sigma-build/yoima5-overlay.tar.gz.b64 -o yoima5-overlay.tar.gz
          tar -xzf yoima5-overlay.tar.gz -C SigmaRemake

      - name: Build Fabric mod
        working-directory: SigmaRemake
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Package modified source
        run: |
          cp -R SigmaRemake SigmaRemake-source
          rm -rf SigmaRemake-source/build SigmaRemake-source/.gradle
          ditto -c -k --sequesterRsrc --keepParent SigmaRemake-source SigmaRemake-Fabric-1.16.5-1.0.5-yoima.5-source.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SigmaRemake-Fabric-1.16.5-1.0.5-yoima.5
          path: |
            SigmaRemake/build/libs/*.jar
            SigmaRemake-Fabric-1.16.5-1.0.5-yoima.5-source.zip
          if-no-files-found: error
          retention-days: 1
