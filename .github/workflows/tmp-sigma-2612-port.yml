name: Temporary Sigma 26.1.2 port

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ tmp-sigma-2612-port-20260807 ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'

      - name: Download Mojang-named 1.16.5 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/8982791154/zip > migrated-artifact.zip
          mkdir migrated-artifact
          unzip -q migrated-artifact.zip -d migrated-artifact
          SRC=$(find migrated-artifact -maxdepth 1 -name '*source.zip' | head -1)
          test -n "$SRC"
          mkdir source-unpacked
          unzip -q "$SRC" -d source-unpacked
          PROJECT=$(find source-unpacked -maxdepth 1 -type d -name 'SigmaRemake*' | head -1)
          test -n "$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Apply 26.1.2 stage1 overlay and remove ViaVersion
        run: |
          base64 -d tmp-sigma-build/port2612-stage1-overlay.tar.gz.b64 > overlay.tar.gz
          tar -xzf overlay.tar.gz -C "$PROJECT"
          sed -i 's/gradle-9.4.0-bin.zip/gradle-9.5.0-bin.zip/' "$PROJECT/gradle/wrapper/gradle-wrapper.properties"
          rm -f "$PROJECT/src/main/resources/sigma-remake.accesswidener"
          rm -f "$PROJECT/src/main/java/io/github/sst/remake/manager/impl/ViaManager.java"
          rm -f "$PROJECT/src/main/java/io/github/sst/remake/mixin/MixinClientPlayNetworkHandler.java"
          rm -f "$PROJECT/src/main/java/io/github/sst/remake/mixin/MixinConfirmScreenActionC2SPacket.java"
          rm -f "$PROJECT/src/main/java/io/github/sst/remake/mixin/MixinConfirmScreenActionS2CPacket.java"
          rm -f "$PROJECT/src/main/java/io/github/sst/remake/mixin/MixinMultiplayerScreen.java"
          rm -rf "$PROJECT/src/main/java/io/github/sst/remake/util/viaversion"

      - name: Build Fabric 26.1.2
        working-directory: ${{ env.PROJECT }}
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Package source
        if: success()
        run: |
          cp -R "$PROJECT" SigmaRemake-Fabric-26.1.2-source
          rm -rf SigmaRemake-Fabric-26.1.2-source/build SigmaRemake-Fabric-26.1.2-source/.gradle
          zip -qr SigmaRemake-Fabric-26.1.2-yoima.8-source.zip SigmaRemake-Fabric-26.1.2-source

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SigmaRemake-Fabric-26.1.2-yoima.8
          path: |
            ${{ env.PROJECT }}/build/libs/*.jar
            SigmaRemake-Fabric-26.1.2-yoima.8-source.zip
          retention-days: 1
