name: Temporary Sigma 26.1.2 port

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ tmp-sigma-2612-port-20260807 ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Download yoima.7 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/8982275533/zip > previous.zip
          mkdir previous
          unzip -q previous.zip -d previous
          SRC=$(find previous -maxdepth 1 -name '*yoima.7-source.zip' | head -1)
          test -n "$SRC"
          mkdir source-unpacked
          unzip -q "$SRC" -d source-unpacked
          PROJECT=$(find source-unpacked -maxdepth 1 -type d -name 'SigmaRemake*' | head -1)
          test -n "$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Migrate Yarn names to Mojang mappings on 1.16.5
        working-directory: ${{ env.PROJECT }}
        run: |
          chmod +x gradlew
          ./gradlew migrateMappings --mappings "net.minecraft:mappings:1.16.5" --input src/main/java --output remappedSrc --stacktrace
          rm -rf src/main/java
          mv remappedSrc src/main/java

      - name: Package migrated source
        run: |
          cp -R "$PROJECT" SigmaRemake-mojmap-1.16.5
          rm -rf SigmaRemake-mojmap-1.16.5/build SigmaRemake-mojmap-1.16.5/.gradle
          zip -qr SigmaRemake-mojmap-1.16.5-source.zip SigmaRemake-mojmap-1.16.5

      - uses: actions/upload-artifact@v4
        with:
          name: SigmaRemake-mojmap-1.16.5-source
          path: SigmaRemake-mojmap-1.16.5-source.zip
          retention-days: 1
