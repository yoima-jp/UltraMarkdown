name: Temporary Sigma ESP yoima.7 build

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ tmp-sigma-esp-yoima7-20260807 ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Download yoima.6 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/8981866543/zip > previous.zip
          mkdir previous
          unzip -q previous.zip -d previous
          SRC=$(find previous -maxdepth 1 -name '*yoima.6-source.zip' | head -1)
          test -n "$SRC"
          mkdir source-unpacked
          unzip -q "$SRC" -d source-unpacked
          PROJECT=$(find source-unpacked -maxdepth 1 -type d -name 'SigmaRemake*' | head -1)
          test -n "$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Apply yoima.7 stencil overlay
        run: |
          base64 -D -i tmp-sigma-build/yoima7-overlay.tar.gz.b64 -o yoima7-overlay.tar.gz
          tar -xzf yoima7-overlay.tar.gz -C "$PROJECT"

      - name: Build Fabric mod
        working-directory: ${{ env.PROJECT }}
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Package modified source
        run: |
          cp -R "$PROJECT" SigmaRemake-yoima7-source
          rm -rf SigmaRemake-yoima7-source/build SigmaRemake-yoima7-source/.gradle
          ditto -c -k --sequesterRsrc --keepParent SigmaRemake-yoima7-source SigmaRemake-Fabric-1.16.5-1.0.5-yoima.7-source.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SigmaRemake-Fabric-1.16.5-1.0.5-yoima.7
          path: |
            ${{ env.PROJECT }}/build/libs/*.jar
            SigmaRemake-Fabric-1.16.5-1.0.5-yoima.7-source.zip
          if-no-files-found: error
          retention-days: 1
